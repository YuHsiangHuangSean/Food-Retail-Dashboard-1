version: 2

models:

  - name: fct_prices_fresh
    description: "Price records for fresh produce"
    config:
      meta:
        owner: "Sean"
        owner_email: "yuhsianghuang.sean@gmail.com"
    columns:
      - name: id
        data_tests:
          - unique
      - name: id
        data_tests:
          - not_null
      - name: discounted
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: country_code
        data_tests:
          - not_null
      - name: price_eur
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null
  
  - name: fct_prices_packaged
    description: "Price records for packaged products"
    config:
      meta:
        owner: "Sean"
        owner_email: "yuhsianghuang.sean@gmail.com"
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: product
        data_tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_products_packaged')
                  field: product
      - name: discounted
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: country_code
        data_tests:
          - not_null
      - name: price_eur
        data_tests:
          - not_null

  - name: dim_products_packaged
    description: "Details for packaged products"
    config:
      meta:
        owner: "Sean"
        owner_email: "yuhsianghuang.sean@gmail.com"
    columns:
      - name: product
        data_tests:
          - unique
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: quantity_unit
        data_tests:
          - not_null

  - name: dim_latest_update_packaged
    description: "Latest update time for packaged products"
    config:
      meta:
        owner: "Sean"
        owner_email: "yuhsianghuang.sean@gmail.com"