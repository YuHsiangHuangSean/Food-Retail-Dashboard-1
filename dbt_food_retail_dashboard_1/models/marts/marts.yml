version: 2

models:

  - name: fct_prices_agg_fresh
    description: "Aggregate prices of fresh produce by category, label, discount, unit, date, and country. Since many groups contain only a few records, the window function PERCENTILE_CONT is used to calculate exact medians"
    config:
      meta:
        owner: "Sean"
        owner_email: "yuhsianghuang.sean@gmail.com"
    columns:
      - name: record_count
        data_tests:
          - not_null
      - name: avg_price_eur
        data_tests:
          - not_null
      - name: median_price_eur
        data_tests:
          - not_null